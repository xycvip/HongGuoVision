name: TV Debug APK

on:
  push:
    branches:
      - feature/tv-large-screen
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/tv-debug-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build TV debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout TV branch
        uses: actions/checkout@v4
        with:
          ref: feature/tv-large-screen

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HongGuoVision-TV-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
